name: isle-fix

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '猫巷。'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python3 scripts/isle_patch.py

      - name: Remove legacy player screen
        run: git rm -f Isle/Features/PlayerView.swift

      - name: Commit and push
        run: |
          git config user.name 'Isle Bot'
          git config user.email 'bot@isle.local'
          git add -A
          git commit -m 'feat(player): 沉浸式封面播放器移植；移除旧播放器与底栏播放键；图标六档下调'
          git push origin HEAD:'猫巷。'

      - name: Trigger build-ipa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref '猫巷。'
