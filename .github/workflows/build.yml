name: build-ipa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show runner
        run: |
          uname -m
          xcodebuild -version

      - name: Install ldid
        run: brew install ldid || true

      - name: Build unsigned ipa + tipa
        run: VERSION=1.12.2 bash build.sh both

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Isle-unsigned-ipa
          path: Isle-unsigned.ipa
          if-no-files-found: error

      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: Isle-tipa
          path: Isle.tipa
          if-no-files-found: warn

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.12.2
          name: 屿声音乐 v1.12.2（图形预热挪出 App.init）
          body: |
            - 修 v1.12.1 启动即闪退：MTLCreateSystemDefaultDevice 不能在 App.init 调用
            - LinkFix 拆成 load() 只 dlopen、warmUp() 在 View.task 里延后一帧预热图形栈
            - 版本号 1.12.2，装完在关于页确认
          files: Isle.tipa
