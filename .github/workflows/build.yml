name: build-ipa
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show runner
        run: |
          uname -m
          xcodebuild -version
      - name: Install ldid
        run: brew install ldid || true
      - name: Build unsigned ipa + tipa
        run: VERSION=1.12.9 bash build.sh both
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Isle-unsigned-ipa
          path: Isle-unsigned.ipa
          if-no-files-found: error
      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: Isle-tipa
          path: Isle.tipa
          if-no-files-found: warn
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.12.9
          name: 屿声音乐 v1.12.9（会员到期与歌单管理）
          body: |
            - 会员到期本地判定，过期即视为免费，不再能用 VIP 功能
            - 我的页会员卡显示 VIP/SVIP 徽章与到期日期、剩余天数
            - 播放器全屏前校验 VIP，无权限直接进卡密页
            - 歌单支持长按删除，二次确认
            - 歌单封面临片改用 item 呈现，修复选图无反应
            - 后台用户支持加 VIP / SVIP / 降级，天数可正可负
            - 版本号 1.12.9
          files: Isle.tipa
