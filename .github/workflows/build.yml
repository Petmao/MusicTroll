name: build-tipa
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build tipa
        run: bash build_tipa.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicTroll-tipa
          path: "*.tipa"
          if-no-files-found: error
