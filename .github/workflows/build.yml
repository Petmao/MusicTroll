name: build-ipa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show runner
        run: |
          uname -m
          xcodebuild -version

      - name: Install ldid
        run: brew install ldid || true

      - name: Build unsigned ipa + tipa
        run: VERSION=1.12.1 bash build.sh both

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Isle-unsigned-ipa
          path: Isle-unsigned.ipa
          if-no-files-found: error

      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: Isle-tipa
          path: Isle.tipa
          if-no-files-found: warn

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.12.1
          name: 屿声音乐 v1.12.1（Metal device + EAGL 常驻，修键盘候选栏崩溃）
          body: |
            - LinkFix 常驻持有 MTLCreateSystemDefaultDevice() 结果，CIContext 走 Metal 而非 EAGL
            - 同时创建 EAGLContext 并 setCurrent，CI::GLContext 构造时共享既有上下文
            - dlopen 补 libGLESv2 / libEGL
            - 版本号 1.12.1，装完在关于页确认
          files: Isle.tipa
