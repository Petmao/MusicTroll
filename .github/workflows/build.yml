name: build-ipa
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show runner
        run: |
          uname -m
          xcodebuild -version
      - name: Install ldid
        run: brew install ldid || true
      - name: Build unsigned ipa + tipa
        run: VERSION=1.12.6 bash build.sh both
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Isle-unsigned-ipa
          path: Isle-unsigned.ipa
          if-no-files-found: error
      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: Isle-tipa
          path: Isle.tipa
          if-no-files-found: warn
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.12.6
          name: 屿声音乐 v1.12.6（交互与歌词）
          body: |
            - 上一曲/下一曲/播放键加按压缩放与触感反馈
            - 搜索结果点击弹出：立即播放 / 加入歌单 / 加入我喜欢的音乐
            - 歌词加网易云兜底，标题先剥后缀再匹配
            - 切到养眼 tab 自动收起迷你播放条，切回来再出现
            - 设置里移除音乐源/视频源入口，统一由后台配置
            - 服务端视频源支持 POST 接口
            - 版本号 1.12.6
          files: Isle.tipa
