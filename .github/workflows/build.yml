name: build-ipa
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show runner
        run: |
          uname -m
          xcodebuild -version
      - name: Install ldid
        run: brew install ldid || true
      - name: Build unsigned ipa + tipa
        run: VERSION=1.13.1 bash build.sh both
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Isle-unsigned-ipa
          path: Isle-unsigned.ipa
          if-no-files-found: error
      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: Isle-tipa
          path: Isle.tipa
          if-no-files-found: warn
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.13.1
          name: 屿声音乐 v1.13.1（点歌秒开播放器）
          body: |
            - 点任何歌曲立刻弹出播放器，封面位显示加载进度，URL 后台加载完自动开始播
            - 播放器标题在音频未就绪时用队列里的歌名占位
            - 服务端新增 /api/import/probe，一眼看出歌单导入卡在哪一步
            - 版本号 1.13.1
          files: Isle.tipa
