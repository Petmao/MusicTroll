name: build-ipa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show runner
        run: |
          uname -m
          xcodebuild -version

      - name: Install ldid
        run: brew install ldid || true

      - name: Build unsigned ipa + tipa
        run: VERSION=1.11.0 bash build.sh both

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Isle-unsigned-ipa
          path: Isle-unsigned.ipa
          if-no-files-found: error

      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: Isle-tipa
          path: Isle.tipa
          if-no-files-found: warn

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.11.0
          name: 屿声音乐 v1.11.0（品牌区 + 版本号可见）
          body: |
            - 版本号从 1.6.0 提到 1.11.0，装完可在关于页确认
            - 登录页品牌区：手绘岛弧 + 双浪 + 音符，八色流动渐变与错峰闪烁
            - 图标统一 IsleIcon（SF Symbols，六档字号，tint 跟随）
          files: Isle.tipa
