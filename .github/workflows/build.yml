name: build-ipa
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show runner
        run: |
          uname -m
          xcodebuild -version
      - name: Install ldid
        run: brew install ldid || true
      - name: Build unsigned ipa + tipa
        run: VERSION=1.13.2 bash build.sh both
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Isle-unsigned-ipa
          path: Isle-unsigned.ipa
          if-no-files-found: error
      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: Isle-tipa
          path: Isle.tipa
          if-no-files-found: warn
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.13.2
          name: 屿声音乐 v1.13.2（VIP 门禁下移到引擎）
          body: |
            - 非 VIP 时 MusicEngine 直接拦截，不再取地址、不再出声
            - 会员到期或降级时立即停播并复位进度
            - 歌单里 “歌名 - 歌手” 整串搜不到时，自动退化成只搜歌名
            - 歌单详情每行加播放图标与触感反馈
            - 版本号 1.13.2
          files: Isle.tipa
