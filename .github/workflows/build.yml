name: build-ipa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show runner
        run: |
          uname -m
          xcodebuild -version

      - name: Install ldid
        run: brew install ldid || true

      - name: Build unsigned ipa + tipa
        run: VERSION=1.12.3 bash build.sh both

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Isle-unsigned-ipa
          path: Isle-unsigned.ipa
          if-no-files-found: error

      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: Isle-tipa
          path: Isle.tipa
          if-no-files-found: warn

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.12.3
          name: 屿声音乐 v1.12.3（多源聚合搜索 + 歌单新建）
          body: |
            - 服务端 /api/search 读 sources 表，多源并发 + 归一化 + 去重，后台加的音乐源真正生效
            - 客户端搜索改走 /api/search，v1 上游仅作兜底
            - 歌单新建从 alert.TextField 改成独立 sheet，iOS 15 可正常输入
            - 歌单详情支持播放全部与单曲点播
            - 版本号 1.12.3
          files: Isle.tipa
