name: build-ipa
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show runner
        run: |
          uname -m
          xcodebuild -version
      - name: Install ldid
        run: brew install ldid || true
      - name: Build unsigned ipa + tipa
        run: VERSION=1.12.8 bash build.sh both
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Isle-unsigned-ipa
          path: Isle-unsigned.ipa
          if-no-files-found: error
      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: Isle-tipa
          path: Isle.tipa
          if-no-files-found: warn
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.12.8
          name: 屿声音乐 v1.12.8（封面与头像自选）
          body: |
            - 歌单封面长按更换，本地存储，可恢复默认
            - 头像点按更换，上传到服务端并即时刷新
            - 云同步接通：歌单与播放进度落库
            - 导入歌单接通：网易云歌单链接可解析曲目
            - 设置移除音乐源/视频源/设备管理入口
            - 修 PhotoPicker 闭包编译错误
            - 版本号 1.12.8
          files: Isle.tipa
