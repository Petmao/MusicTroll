name: build-ipa

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show runner
        run: |
          uname -m
          xcodebuild -version

      - name: Install ldid
        run: brew install ldid || true

      - name: Build unsigned ipa + tipa
        run: VERSION=1.12.0 bash build.sh both

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Isle-unsigned-ipa
          path: Isle-unsigned.ipa
          if-no-files-found: error

      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: Isle-tipa
          path: Isle.tipa
          if-no-files-found: warn

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.12.0
          name: 屿声音乐 v1.12.0（键盘候选栏崩溃修复）
          body: |
            - 链接 Metal / MetalKit / CoreVideo，修 iOS 15 键盘候选栏 CIContext 走 EAGL 时 pc=0
            - LinkFix 补 dlopen 并用 CPU CIContext 预热
            - 取色 CIContext 改 software renderer
            - 登录页移除 @FocusState 与零高度隐藏布局
            - 版本号 1.12.0
          files: Isle.tipa
