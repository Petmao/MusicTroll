name: build-ipa
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show runner
        run: |
          uname -m
          xcodebuild -version
      - name: Install ldid
        run: brew install ldid || true
      - name: Build unsigned ipa + tipa
        run: VERSION=1.13.0 bash build.sh both
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Isle-unsigned-ipa
          path: Isle-unsigned.ipa
          if-no-files-found: error
      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: Isle-tipa
          path: Isle.tipa
          if-no-files-found: warn
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.13.0
          name: 屿声音乐 v1.13.0（搜索提速与歌单修复）
          body: |
            - 搜索总预算 7 秒，慢源直接放弃，先返回已拿到的结果
            - 同关键词 60 秒内走缓存，重复搜索秒出
            - 单源超时 15 秒降到 6 秒
            - 收藏列表可点击播放，心形改为独立点击区
            - 歌单删除改用 Bool 弹窗 + 独立 ID，修删不掉
            - 版本号 1.13.0
          files: Isle.tipa
