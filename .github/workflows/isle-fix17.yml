name: isle-fix17
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '猫巷。'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch playlist import
        run: python3 scripts/isle_patch22.py
      - name: Verify
        run: |
          grep -c importQQ server-v2/server.js
          grep -c importKugou server-v2/server.js
          node --check server-v2/server.js
      - name: Commit and push
        run: |
          git config user.name 'Isle Bot'
          git config user.email 'bot@isle.local'
          git add server-v2/server.js
          git diff --cached --stat
          git commit -m 'feat(import): 歌单导入支持 QQ 音乐与酷狗，汽水返回不支持标记'
          git push origin HEAD:'猫巷。'
      - name: Trigger pack-server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pack-server.yml --ref '猫巷。'
