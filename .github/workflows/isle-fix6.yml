name: isle-fix6

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '猫巷。'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch brand mark
        run: python3 scripts/isle_patch7.py

      - name: Commit and push
        run: |
          git config user.name 'Isle Bot'
          git config user.email 'bot@isle.local'
          git add -A
          git commit -m 'fix(login): 去掉 @FocusState 与回收式高度 hack，品牌标题改静态渐变，修点输入框闪退'
          git push origin HEAD:'猫巷。'

      - name: Trigger build-ipa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref '猫巷。'
