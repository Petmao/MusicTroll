# /etc/nginx/conf.d/ys.irepo.cn.conf
server {
    listen 80;
    server_name ys.irepo.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ys.irepo.cn;

    # certbot 会自动填这两行
    # ssl_certificate     /etc/letsencrypt/live/ys.irepo.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ys.irepo.cn/privkey.pem;

    client_max_body_size 4m;

    # 管理后台
    location /admin.html {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 音频/视频流：必须关 buffering，否则 AVPlayer 拖动会卡
    location /stream/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 头像静态
    location /avatar/ {
        alias /opt/isle/server/data/avatars/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
